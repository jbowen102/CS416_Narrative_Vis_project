<html>
	<div id="primary" class="content-area grid-100 tablet-grid-100 mobile-grid-100">
		<main id="main" class="site-main" role="main">
            <div class="entry-content special-page-content">

                <!-- custom HTML starts here -->

                <script src='https://d3js.org/d3.v5.min.js'></script>
                <!-- <style> circle {fill: royalblue; stroke: black;} </style> -->

                <!-- <body onload='init()' style="background-color: black;"> -->
                <body onload='init()'>

                    <p>Swallow-tailed Kite migration routes</p>    

                    <svg width="1200" height="1200">

                    </svg>

                <script>

                    async function init() {

                        const plot_height = 1000;
                        const plot_width = 1000;
                        const margin = 70;

                        // const stk_data = await d3.csv("/data/CS416_NVis_project/swallow_tailed_kite_compl_20260726_zf_clean_agg_weekly.csv", d3.autoType);
                        const stk_data = await d3.csv("source_data_upload/CS416_NVis_project/swallow_tailed_kite_compl_20260726_zf_clean_agg_weekly.csv", d3.autoType);

                        const x = d3.scaleLinear()
                            .domain([-108, -50])
                            .range([0, plot_width]);

                        const y = d3.scaleLinear()
                            .domain([-15, 40])
                            .range([plot_height, 0]);

                        let targetWeek = 30;

                        d3.select("svg").append("g")
                            .attr("transform", "translate(" + margin + "," + margin + ")")
                            .selectAll("circle")
                            .data(stk_data)
                            .enter()
                            .append("circle")
                            .attr("fill", "white")
                            .attr("stroke", "black")
                            .attr("cx", function (d) { return x(d.cell_ctr_lon); })
                            .attr("cy", function (d) { return y(d.cell_ctr_lat); })
                            .attr("r", 4)
                            .transition().duration(4000)
                            .attr("fill", function (d) { return (d.det_freq > 0 ? "royalblue" : "white") });

                        // set up axes
                        d3.select("svg")
                            .append("g")
                            .attr("transform", "translate(" + margin + "," + margin + ")")
                            .call(d3.axisLeft(y));

                        d3.select("svg")
                            .append("g")
                            .attr("transform", "translate(" + margin + "," + (plot_height + margin) + ")")
                            .call(d3.axisBottom(x));
                    }



                </script>

                <!-- custom HTML ends here -->

            </div><!-- .entry-content -->

		</main><!-- #main -->
	</div><!-- #primary -->
