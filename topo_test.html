<html>
    <head>
        <meta charset="utf-8">
    </head>
    <style>
        body {
            background: black;
            color: white;
        }
        path {
            fill: rgb(51, 51, 51);
            fill-opacity: 0.8;
            stroke: lightgrey;
            vector-effect: non-scaling-stroke; /* keeps borders readable while zooming */
        }

        .graticule {
            fill: none;
            stroke: #ccc;
            stroke-width: .5px;
        }

        .graticule-label {
            fill: white;
            font-size: 18px;
            pointer-events: none;
        }
        .foreground {
            fill: none;
            stroke: #333;
            stroke-width: 1.5px;
        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src='https://unpkg.com/topojson-client@3'></script>
    
    <body>
        <svg id="map"></svg>
        <script>
            window.addEventListener("load", init);

            const svg = d3.select("#map");
            const svgWidth = 960;
            const svgHeight = 600;
            svg.attr("width", svgWidth).attr("height", svgHeight);

            const mapLayer = svg.append("g").attr("class", "map-layer");  // zoomable layer
            const labelLayer = svg.append("g").attr("class", "label-layer"); // lat/lon labels

            let graticule;
            let path;
            let projection;
            let currentTransform = d3.zoomIdentity;
            let lat_range;
            let lon_range;

            function makeLabels() {
                labelLayer.selectAll("*").remove();

                const lonValues = d3.range(Math.ceil(lon_range[0] / 10) * 10, lon_range[1] + 1, 10);
                const lonLabels = lonValues.map(lon => {
                    const p = projection([lon, lat_range[0]]);
                    return p ? { text: `${lon}°`, x: p[0], y: p[1] + 45, anchor: "middle" } : null;
                    // return p ? { text: `${lon}°`, x: p[0], y: p[1] + 14, anchor: "middle" } : null;
                }).filter(Boolean);

                labelLayer.selectAll(".lon-label")
                          .data(lonLabels)
                          .enter()
                          .append("text")
                          .attr("class", "graticule-label lon-label")
                          .attr("data-x", d => d.x)
                          .attr("data-y", d => d.y)
                          .attr("text-anchor", "middle")
                          .text(d => d.text);

                const latValues = d3.range(Math.ceil(lat_range[0] / 10) * 10, lat_range[1] + 1, 10);
                const latLabels = latValues.map(lat => {
                    const p = projection([lon_range[0], lat]);
                    return p ? { text: `${lat}°`, x: p[0] - 100, y: p[1] - 5, anchor: "end" } : null;
                    // return p ? { text: `${lat}°`, x: p[0] - 6, y: p[1] + 4, anchor: "end" } : null;
                }).filter(Boolean);

                labelLayer.selectAll(".lat-label")
                          .data(latLabels)
                          .enter()
                          .append("text")
                          .attr("class", "graticule-label lat-label")
                          .attr("data-x", d => d.x)
                          .attr("data-y", d => d.y)
                          .attr("text-anchor", "end")
                          .text(d => d.text);
            }

            function updateLabelTransform() {
                const k = currentTransform.k || 1;
                labelLayer.selectAll("text")
                          .attr("transform", function () {
                              const x = +this.getAttribute("data-x");
                              const y = +this.getAttribute("data-y");
                              return `translate(${currentTransform.applyX(x)}, ${currentTransform.applyY(y)})`;
                });
            }

            async function init() {
                const data_stk = await d3.csv("source_data_upload/swallow_tailed_kite_compl_exp_range_20260729_zf_clean_agg_weekly.csv", d3.autoType);

                lat_range = d3.extent(data_stk, d => Math.round(d.cell_ctr_lat));
                lon_range = d3.extent(data_stk, d => Math.round(d.cell_ctr_lon));
                const centerLon = (lon_range[0]-1 + lon_range[1]) / 2;
                const centerLat = (lat_range[0]-1 + lat_range[1]) / 2;

                projection = d3.geoMercator()
                               .center([centerLon, centerLat])
                               .scale(530);
                path = d3.geoPath()
                         .projection(projection);
                graticule = d3.geoGraticule();

                // zoom and pan
                const zoom = d3.zoom()
                               .scaleExtent([1, 8]) // min/max zoom
                               .extent([[0, 0], [svgWidth, svgHeight]]) // define the area in which zooming is allowed
                               .translateExtent([[0,0],[svgWidth, svgHeight]]) // limit panning to given area
                               // TODO  update to reflect area I have data for. Make sure it extends at least slightly outside the starting window
                               .on("zoom", (event) => {
                                    currentTransform = event.transform;
                                    mapLayer.attr("transform", currentTransform);
                                    updateLabelTransform();
                               });

                svg.call(zoom);

                d3.json("source_data/countries-50m.json")
                    .then(drawMap)
                    .catch(console.error);

                // for label creation
                window.lon_range = lon_range;
                window.lat_range = lat_range;

                makeLabels();
                updateLabelTransform();

            }

            function drawMap(world) {

                mapLayer.append("path")
                        .datum(graticule())
                        .attr("class", "graticule")
                        .attr("d", path);

                mapLayer.append("path")
                        .datum(graticule.outline())
                        .attr("class", "foreground")
                        .attr("d", path);

                const countries = topojson.feature(world, world.objects.countries).features;

                mapLayer.append("g")
                        .selectAll("path")
                        .data(countries)
                        .enter()
                        .append("path")
                        .attr("d", path);
            }
        </script>
    </body>


</html>
