<html>
    <style>
        body {
            background: black;
            color: white;
        }
        path {
            fill: rgb(51, 51, 51);
            fill-opacity: 0.8;
            stroke: lightgrey;
            vector-effect: non-scaling-stroke; /* keeps borders readable while zooming */
        }

        .graticule {
            fill: none;
            stroke: #ccc;
            stroke-width: .5px;
        }

        .foreground {
            fill: none;
            stroke: #333;
            stroke-width: 1.5px;
        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src='https://unpkg.com/topojson-client@3'></script>
    
    <body>
        <svg id="map"></svg>
        <script>
            window.addEventListener("load", init);

            const svg = d3.select("#map");
            const svgWidth = 960;      // fixed
            const svgHeight = 600;     // fixed
            svg.attr("width", svgWidth).attr("height", svgHeight);

            const mapLayer = svg.append("g").attr("class", "map-layer");  // zoomable layer
            let graticule;
            let path;

            async function init() {
                data_stk = await d3.csv("source_data_upload/swallow_tailed_kite_compl_exp_range_20260729_zf_clean_agg_weekly.csv", d3.autoType);

                const lat_range = d3.extent(data_stk, d => Math.round(d.cell_ctr_lat));
                const lon_range = d3.extent(data_stk, d => Math.round(d.cell_ctr_lon));
                const centerLon = (lon_range[0]-1 + lon_range[1]) / 2;
                const centerLat = (lat_range[0]-1 + lat_range[1]) / 2;

                const projection = d3.geoMercator()
                                     .center([centerLon, centerLat])
                                     .scale(530);
                path = d3.geoPath()
                         .projection(projection);
                graticule = d3.geoGraticule();

                // Zoom + pan behavior
                const zoom = d3.zoom()
                               .scaleExtent([1, 8]) // min/max zoom
                               .extent([[0, 0], [svgWidth, svgHeight]]) // define the area in which zooming is allowed
                               .translateExtent([[0,0],[svgWidth, svgHeight]]) // limit panning to given area
                               .on("zoom", (event) => {
                                       mapLayer.attr("transform", event.transform);
                               });

                svg.call(zoom);

                d3.json("source_data/countries-50m.json")
                    .then(drawMap)
                    .catch(console.error);
            }

            function drawMap(world) {

                mapLayer.append("path")
                        .datum(graticule())
                        .attr("class", "graticule")
                        .attr("d", path);

                mapLayer.append("path")
                        .datum(graticule.outline())
                        .attr("class", "foreground")
                        .attr("d", path);

                const countries = topojson.feature(world, world.objects.countries).features;

                mapLayer.append("g")
                        .selectAll("path")
                        .data(countries)
                        .enter()
                        .append("path")
                        .attr("d", path);
            }
        </script>
    </body>


</html>
